name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pig: ['0.5.3', '0.7.0'] # the oldest supported PiG and the latest release; each builds the extension against its own SDK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: extensions/sol-pig/go.mod
          cache-dependency-path: extensions/sol-pig/go.sum
      - name: Unit and fake-host tests
        working-directory: extensions/sol-pig
        run: go vet ./... && go test ./...
      - name: Scripted endpoint tests
        working-directory: scripts/live/mockprovider
        run: go vet ./... && go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PiG
        run: npm install -g "@pi-in-go/pig@${{ matrix.pig }}" && pig --version
      - name: Live check against PiG's fake provider
        run: scripts/live/verify.sh "$RUNNER_TEMP/sol-pig-live"
